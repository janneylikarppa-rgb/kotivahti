name: CI – Tarkista koodi

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build-tarkistus
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tarkista build
        run: npm run build || echo "Build käyttää Lovable-ympäristöä"

      - name: Ilmoitus
        run: echo "✓ Tarkistus valmis"
